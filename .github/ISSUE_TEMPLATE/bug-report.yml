name: Resource bug report
description: Report a defect in a skill, plugin, prompt, reference, manifest, or repository workflow.
title: "[Bug]: "
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for defects in this repository's AI resources. For corrections to the Acumatica documentation under `Documentation/`, email training@acumatica.com instead.

  - type: input
    id: resource
    attributes:
      label: Affected resource
      description: Provide the repository-relative path to the affected skill, plugin, or file.
      placeholder: DEV/skills/example-skill/SKILL.md
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: Acumatica release
      description: Identify the release branch where the problem occurs.
      placeholder: 2026R1
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is incorrect or not working.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what should happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or evidence
      description: Provide the prompt, steps, relevant output, or links needed to reproduce or verify the problem. Remove sensitive information.
    validations:
      required: true

  - type: textarea
    id: proposed-fix
    attributes:
      label: Suggested correction
      description: Describe a possible correction if you have one.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no secrets, customer data, or confidential information.
          required: true
